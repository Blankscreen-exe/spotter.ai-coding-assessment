# Runs on every push and pull request: the linter and formatter, the tests on
# SQLite with the page driven in a browser, and the tests again on PostgreSQL.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (SQLite, with the browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The runner has Chrome installed; the browser tests drive that one.
      - run: python manage.py test
        env:
          BROWSER_CHANNEL: chrome

  test-postgres:
    name: test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fuelroute
          POSTGRES_USER: fuelroute
          POSTGRES_PASSWORD: fuelroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuelroute -d fuelroute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          DATABASE_URL: postgres://fuelroute:fuelroute@localhost:5432/fuelroute
