# Local stack: the API on PostgreSQL with Redis as the route cache.
#
#   docker compose up --build
#   http://localhost:8000/map/
#
# The credentials below are for this local stack only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fuelroute
      POSTGRES_USER: fuelroute
      POSTGRES_PASSWORD: fuelroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Checked over TCP on purpose: during first-run initialisation Postgres
      # answers on its socket only, then restarts, and "healthy" must mean the
      # real server is accepting connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fuelroute -d fuelroute"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    # A cache, so it gets a ceiling and gives up its least recently used entries
    # when it reaches it. Without one it would grow until the host ran out of
    # memory: a cross-country route is about 110 KB and lives for an hour.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fuelroute:fuelroute@db:5432/fuelroute
      REDIS_URL: redis://cache:6379/0
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-stack-only}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Django Debug Toolbar on every page of this local stack: SQL, cache calls
      # and timing for each request. DJANGO_DEBUG_TOOLBAR=false docker compose up
      # runs the stack without it.
      DJANGO_DEBUG_TOOLBAR: ${DJANGO_DEBUG_TOOLBAR:-true}
      # Login for http://localhost:8000/admin/ on this local stack.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-fuelroute-demo}
    # Published to this machine only. The stack carries a published admin password
    # and the debug toolbar, so nothing else on the network should reach it.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  pgdata:
